{% extends 'base.html' %}

{% block meta %}
<title>Login - {{ name }}</title>
{% endblock meta %}

{% block content %}

<section class="login">
    <div class="container">
        <p class="section-kicker">Welcome Back</p>
        <h1>Login</h1>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Login</button>
        </form>

        <p>
            Don't have an account?
            <a href="{% url 'main:register' %}">Register here</a>
        </p>
    </div>
</section>

{% endblock content %}
