<section class="experience">
    <div class="container experience-form-container">
        <p class="section-kicker">{{ form_kicker }}</p>
        <h1>{{ form_title }}</h1>

        <form method="POST" class="experience-form">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-add">
                {{ button_text }}
            </button>
        </form>
    </div>
</section>
