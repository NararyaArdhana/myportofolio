{% extends 'base.html' %}

{% block meta %}
<title>Register - {{ name }}</title>
{% endblock meta %}

{% block content %}

<section class="auth-section">
    <div class="auth-card">

        <div class="auth-header">
            <p class="section-kicker">Create Account</p>
            <h1>Register</h1>
            <p class="auth-subtitle">
                Create an account to interact with the portfolio.
            </p>
        </div>

        <form method="POST" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="auth-button">
                Create Account
            </button>
        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{% url 'main:login' %}">
                Login here
            </a>
        </p>

    </div>
</section>

{% endblock content %}
